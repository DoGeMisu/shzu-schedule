plugins {
    id 'com.android.application'
}

// 固定签名：读取项目根目录的 keystore.properties（不入库，见 .gitignore）。
// 目的是让 assembleDebug 产出的包能直接覆盖安装到已装机型上，
// 避免签名不一致导致 INSTALL_FAILED_UPDATE_INCOMPATIBLE 或重装丢数据。
// 若该文件不存在（如他人 clone 后首次构建），则回退到 Gradle 默认调试签名。
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.shzu.schedule'
    compileSdk 34

    defaultConfig {
        applicationId "com.shzu.schedule"
        minSdk 24
        targetSdk 34
        versionCode 17
        versionName "1.4.7"

        // 更新服务 API Key：优先读本地凭据文件 keystore.properties（不入库），
        // 其次读 gradle.properties 的 shzuUpdateApiKey（供他人构建时自带）。
        // 业务代码只引用 BuildConfig.UPDATE_API_KEY；缺省空串时退化为匿名受限通道。
        def updateKey = keystoreProps['updateApiKey'] ?: (project.findProperty('shzuUpdateApiKey') ?: '')
        buildConfigField "String", "UPDATE_API_KEY", "\"${updateKey}\""
        if (!updateKey) {
            logger.warn('[更新服务] 未配置 updateApiKey，将使用匿名受限下载通道（每 IP 每天 5 次）')
        }
    }

    buildFeatures {
        // AGP 8 起 BuildConfig 默认关闭，这里显式打开以承载注入的 API Key
        buildConfig true
    }

    // APK 统一命名规则（以后每次构建都按这个产出，不用再手动改名）：
    //   release → shzu-schedule-v<版本名>.apk
    //   debug   → shzu-schedule-v<版本名>-debug.apk
    // 上传到更新服务器时用 release 那个名字，与 m1SuHub 下载管理里的文件名保持一致。
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def suffix = variant.buildType.name == "release" ? "" : "-" + variant.buildType.name
            outputFileName = "shzu-schedule-v" + variant.versionName + suffix + ".apk"
        }
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            fixed {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.fixed
            }
        }
        release {
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.fixed
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
